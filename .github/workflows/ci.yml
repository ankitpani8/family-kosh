name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck and engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  database:
    name: Schema and privacy rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/shim.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_init.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql 2>&1 | tee rls.log
      - run: "! grep -q FAILED rls.log"
